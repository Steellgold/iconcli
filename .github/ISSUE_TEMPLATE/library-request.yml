name: Library Request
description: Suggest a new icon library to integrate with mkicon
title: "[Library Request]: "
labels:
  - enhancement
  - library-request
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new icon library.
        Please complete the fields below.

  - type: input
    id: library_name
    attributes:
      label: Library name
      description: What is the name of the icon library?
      placeholder: Heroicons
    validations:
      required: true

  - type: input
    id: library_url
    attributes:
      label: Library website
      description: Official website or documentation URL.
      placeholder: https://heroicons.com
    validations:
      required: true

  - type: dropdown
    id: is_open_source
    attributes:
      label: Is it open source?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: input
    id: license_name
    attributes:
      label: License
      description: License used by the library, if available.
      placeholder: MIT

  - type: input
    id: icon_count
    attributes:
      label: Number of icons
      description: Approximate number of available icons.
      placeholder: 500+

  - type: input
    id: api_or_index_url
    attributes:
      label: API or icon index URL (optional)
      description: URL to an endpoint or file listing icons.
      placeholder: https://unpkg.com/heroicons@latest/tags.json

  - type: input
    id: icon_url_pattern
    attributes:
      label: Icon URL pattern (optional)
      description: URL pattern used to fetch individual SVG files.
      placeholder: https://cdn.example.com/icons/<icon-name>.svg

  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
      description: Any extra details to help evaluate this integration.
      placeholder: |
        - Multiple styles or sizes
        - Attribution requirements
        - Why this library is useful
